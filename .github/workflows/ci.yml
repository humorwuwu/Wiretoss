name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Linux 上 egui/winit 要链接 X11 和 Wayland，这些开发库 ubuntu runner 不自带。
      # macOS / Windows 用的是系统框架，不需要额外安装。
      - name: 安装 Linux 图形依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # 在三个平台上都跑测试，而不是只跑 Linux。
      # 这个程序的价值就在跨平台，路径分隔符、文件重命名语义、
      # 保留文件名这些差异只有真在 Windows 上跑才会暴露。
      - name: 测试
        run: cargo test --all-targets

      - name: Release 构建
        run: cargo build --release
