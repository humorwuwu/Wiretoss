name: Release

on:
  push:
    tags: ["v*"]
  # 手动触发，用来验证打包流程而不必真的发版
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS 单独一个 job：要同时编两个架构再用 lipo 合成通用二进制，
  # 装进 .app 包，这和"一个 target 一个产物"的通用矩阵对不上。
  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      # 先跑测试再打包：CI 绿了才说明这个平台上的产物是真能用的。
      # 注意跑的是 runner 的原生架构（arm64），x86_64 那份只保证能编译。
      - name: 测试
        run: cargo test --all-targets

      - name: 构建两个架构
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: 组装 .app 并压缩
        run: |
          ./scripts/make-app.sh Wiretoss.app \
            target/aarch64-apple-darwin/release/wiretoss \
            target/x86_64-apple-darwin/release/wiretoss
          ditto -c -k --sequesterRsrc --keepParent Wiretoss.app \
            "wiretoss-${{ github.ref_name }}-macos-universal.zip"

      - name: 校验和
        run: shasum -a 256 wiretoss-*.zip > "wiretoss-${{ github.ref_name }}-macos-universal.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            wiretoss-*.zip
            wiretoss-*.sha256

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: 测试
        run: cargo test --all-targets

      - name: 构建
        run: cargo build --release --locked

      - name: 打包
        shell: pwsh
        run: |
          $name = "wiretoss-${{ github.ref_name }}-windows-x64"
          Compress-Archive -Path "target/release/wiretoss.exe", "README.md" -DestinationPath "$name.zip"
          # 写成标准的 "<hash>  <文件名>" 两空格格式，和 macos 那边 shasum 的输出一致，
          # 这样任何平台上都能直接 `shasum -a 256 -c` 校验。
          # 两个坑：
          #   1. Out-File 在 Windows 上写 CRLF。shasum -c 会拿着尾部带 \r 的文件名去找
          #      文件，报的是 "No such file or directory" 而不是校验失败，很难一眼看出
          #      是换行符问题 —— 所以这里显式写 LF。
          #   2. .NET 的相对路径按**进程当前目录**解析，不是 PowerShell 的当前位置，
          #      传相对路径文件会写到别处去，必须拼绝对路径。
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          $shaPath = Join-Path $PWD.Path "$name.zip.sha256"
          [System.IO.File]::WriteAllText($shaPath, "$hash  $name.zip`n")
          # 自检：上面那个坑如果复发，就在打包这一步直接失败，而不是等用户下载后
          # 校验不过才发现。
          if ((Get-Content -Raw $shaPath) -match "`r") {
            throw "校验和文件含 CR，shasum -c 会失败：$shaPath"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            wiretoss-*.zip
            wiretoss-*.sha256

  release:
    needs: [macos, windows]
    # workflow_dispatch 时 github.ref 是 refs/heads/main，不是 tag，
    # action-gh-release 会拿 ref_name（即 "main"）当 tag 名去建 Release，
    # 建出一个叫 main 的 tag 毫无意义。手动触发的用途本来就是「只验证打包、
    # 不真的发版」，产物在本次 run 的 Artifacts 里下载即可，跳过发布这一步。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## 下载

            | 平台 | 文件 |
            |---|---|
            | macOS（Apple Silicon + Intel 通用） | `wiretoss-${{ github.ref_name }}-macos-universal.zip` |
            | Windows (x64) | `wiretoss-${{ github.ref_name }}-windows-x64.zip` |

            **macOS**：解压后双击 `Wiretoss.app`。首次打开会被 Gatekeeper 拦下
            （应用没有 Apple 开发者签名），右键点图标选「打开」即可放行一次。

            **Windows**：解压后双击 `wiretoss.exe`。首次运行需要允许防火墙的
            「专用网络」访问，否则对端连不上。

            详见 [README](https://github.com/humorwuwu/Wiretoss/blob/main/README.md)。

            每个包附同名 `.sha256` 文件，下载后可校验完整性：

            ```bash
            shasum -a 256 -c wiretoss-*.zip.sha256
            ```
