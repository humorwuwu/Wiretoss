name: Wiretoss
options:
  bundleIdPrefix: dev.wiretoss
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Wiretoss:
    type: application
    platform: iOS
    sources:
      - path: Wiretoss
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wiretoss.mobile
        PRODUCT_NAME: Wiretoss
        INFOPLIST_FILE: Wiretoss/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets:
        - WiretossUITests
  WiretossUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WiretossUITests
    dependencies:
      - target: Wiretoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wiretoss.mobile.uitests
        TEST_TARGET_NAME: Wiretoss
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
